name: Manual Patch and Update

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App name (from apps/ folder)'
        required: true
        type: string
        default: 'youtube'
      source:
        description: 'Source name (from sources/ folder)'
        required: true
        type: string
        default: 'revanced'
      version:
        description: 'Specific version (leave empty for latest)'
        required: false
        type: string
        default: ''
      architecture:
        description: 'Stock APK architecture to download; output is always arm64-v8a'
        required: false
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - universal
        default: 'universal'
      skip_locale_slimming:
        description: 'Skip APKEditor locale rewriting (diagnose resource decode failures)'
        required: false
        type: boolean
        default: false
      replace_in_release:
        description: 'Publish APKs to the latest GitHub release'
        required: true
        type: boolean
        default: true

jobs:
  manual-patch:
    runs-on: ubuntu-latest
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8192:8191
        options: --shm-size=1gb
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set Specific Version (if provided)
        if: ${{ inputs.version != '' }}
        run: |
          # Update app config with specific version
          for dir in apps/apkmirror apps/apkpure apps/uptodown; do
            config_file="$dir/${{ inputs.app_name }}.json"
            if [ -f "$config_file" ]; then
              echo "Updating $config_file with version ${{ inputs.version }}"
              # Update JSON with specific version (single line to avoid
              # indentation issues inside python -c)
              python3 -c "import json; p='$config_file'; c=json.load(open(p)); c['version']='${{ inputs.version }}'; json.dump(c, open(p, 'w'), indent=2)"
              echo "Updated: $config_file"
              break
            fi
          done
      
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests beautifulsoup4
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Wait for FlareSolverr
        run: |
          echo "Waiting for FlareSolverr to be ready..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8192/ > /dev/null 2>&1; then
              echo "FlareSolverr is ready."
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done

      - name: Build APK
        env:
          APP_NAME: ${{ inputs.app_name }}
          SOURCE: ${{ inputs.source }}
          ARCH: arm64-v8a
          APK_ARCH: ${{ inputs.architecture }}
          SKIP_LOCALE_SLIMMING: ${{ inputs.skip_locale_slimming }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_API_ID: ${{ inputs.app_name == 'telegram' && inputs.source == 'hushtelegram' && secrets.TELEGRAM_API_ID || '' }}
          TELEGRAM_API_HASH: ${{ inputs.app_name == 'telegram' && inputs.source == 'hushtelegram' && secrets.TELEGRAM_API_HASH || '' }}
          TELEGRAM_UPTODOWN_APK_URL: ${{ inputs.app_name == 'telegram' && inputs.source == 'hushtelegram' && secrets.TELEGRAM_UPTODOWN_APK_URL || '' }}
          FLARESOLVERR_URL: http://localhost:8192/v1
        run: |
          echo "🔧 Building ${{ inputs.app_name }} with ${{ inputs.source }} from a ${{ inputs.architecture }} APK; output is arm64-v8a..."
          python -m src
      
      - name: Find Built APK
        id: find-apk
        run: |
          # Find the built APK file(s)
          shopt -s nullglob
          apk_paths=( *.apk )
          if [ "${#apk_paths[@]}" -eq 0 ]; then
            echo "❌ No APK files found"
            exit 1
          fi
          apk_files=$(printf '%s\n' "${apk_paths[@]}")
          
          # Fix for multi-line output in GitHub Actions
          {
            echo "apk_files<<EOF"
            echo "$apk_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          
          echo "apk_count=$(echo "$apk_files" | wc -l)" >> "$GITHUB_OUTPUT"
          
          # Print for debugging
          echo "Found these APKs:"
          echo "$apk_files"
      
      - name: Upload as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manual-apk-${{ inputs.app_name }}-${{ inputs.architecture }}
          path: "*.apk"
      
      - name: Publish to GitHub Releases
        if: ${{ inputs.replace_in_release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag=latest
          release_title="Morphe APKs - $(date -u +'%Y-%m-%d %H:%M UTC')"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" *.apk --clobber
            gh release edit "$release_tag" --title "$release_title"
          else
            gh release create "$release_tag" *.apk \
              --title "$release_title" \
              --notes "Manually built APKs for ${{ inputs.app_name }} from ${{ inputs.source }}." \
              --latest
          fi

          printf '%s\n' *.apk > keep_apks.txt
          python scripts/cleanup_old_apks.py \
            --release "$release_tag" \
            --keep-file keep_apks.txt

      - name: Verify GitLab Release Health
        if: always() && ${{ inputs.replace_in_release == true }}
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT_ID: "87288318"
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::notice::Skipping GitLab release health check because GITLAB_TOKEN is not configured."
            exit 0
          fi

          # Safety net for the 2026-10-09 / 2026-10-22 failure mode: if the
          # publish step died after the tag move, GitLab is left with the tag
          # but zero releases, and the store shows every patched app as
          # unavailable. Verify health; on failure run the proven
          # --rebuild-links recovery once, then fail loudly if still broken.
          if python scripts/gitlab_publish_release.py --verify-only --tag latest; then
            echo "GitLab release verified healthy."
          else
            echo "Release unhealthy; running automatic recovery..."
            python scripts/gitlab_publish_release.py --rebuild-links --tag latest
            python scripts/gitlab_publish_release.py --verify-only --tag latest
          fi

      - name: Publish Summary
        if: ${{ inputs.replace_in_release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(ls -1 *.apk 2>/dev/null | wc -l)
          release_url=$(gh release view latest --json url --jq .url)
          echo "Published $count APK(s) to $release_url"

      - name: Cleanup Version Override
        if: ${{ inputs.version != '' && always() }}
        run: |
          # Reset version to empty in configs
          for dir in apps/apkmirror apps/apkpure apps/uptodown; do
            config_file="$dir/${{ inputs.app_name }}.json"
            if [ -f "$config_file" ]; then
              echo "Resetting version in $config_file"
              python3 -c "import json; p='$config_file'; c=json.load(open(p)); c['version']=''; json.dump(c, open(p, 'w'), indent=2)"
            fi
          done
